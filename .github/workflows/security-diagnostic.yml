name: Capture Edge Function type-check diagnostics

on:
  push:
    branches:
      - agent/production-security-1-10

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip security diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-security-1-10
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply narrow type correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/secure-worker-callback/index.ts')
          text = path.read_text()
          text = text.replace(
              'const archiveStatus = input.archive?.status || "not_archive";',
              'const archiveStatus: string = input.archive?.status || "not_archive";',
          )
          path.write_text(text)
          PY
      - name: Capture type-check output
        shell: bash
        run: |
          mkdir -p security-diagnostics
          set +e
          deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts supabase/functions/*/index.ts > security-diagnostics/deno-check.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> security-diagnostics/deno-check.log
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/secure-worker-callback/index.ts security-diagnostics/deno-check.log
          git commit -m "Capture Edge Function diagnostics [skip security diagnostic]"
          git push origin HEAD:agent/production-security-1-10
