name: Deploy EdNotebook production and staging

on:
  workflow_run:
    workflows: [Validate EdNotebook production and staging]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ednotebook-pages-combined
  cancel-in-progress: false

jobs:
  package-pages:
    name: Build production root and staging subsite
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.refs.outputs.production_sha }}
      staging_sha: ${{ steps.refs.outputs.staging_sha }}
      live_operating_lane: ${{ steps.refs.outputs.live_operating_lane }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: production-source
          fetch-depth: 1

      - name: Checkout staging source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: staging
          path: staging-source
          fetch-depth: 1

      - name: Record source commits
        id: refs
        shell: bash
        run: |
          echo "production_sha=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$(git -C staging-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          live_operating_lane="${{ vars.EDNOTEBOOK_LIVE_OPERATING_LANE }}"
          if [[ -z "$live_operating_lane" ]]; then live_operating_lane="beta"; fi
          if [[ "$live_operating_lane" != "beta" && "$live_operating_lane" != "pilot" ]]; then
            echo "EDNOTEBOOK_LIVE_OPERATING_LANE must be beta or pilot; unlabeled production requires the protected production-promotion workflow" >&2
            exit 1
          fi
          echo "live_operating_lane=$live_operating_lane" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            staging-source/package-lock.json

      - name: Build production from main
        working-directory: production-source
        env:
          VITE_APP_ENVIRONMENT: live
          VITE_LIVE_OPERATING_LANE: ${{ steps.refs.outputs.live_operating_lane }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run audit:bundle

      - name: Build staging from staging
        working-directory: staging-source
        run: |
          npm ci --no-audit --no-fund
          npm run build:staging
          npm run audit:bundle

      - name: Assemble one GitHub Pages artifact
        shell: bash
        run: |
          mkdir -p pages-root/staging
          cp -a production-source/dist/. pages-root/
          cp -a staging-source/dist/. pages-root/staging/
          rm -f pages-root/staging/CNAME
          cat > pages-root/environment.json <<EOF
          {
            "deployment_surface": "live_service",
            "operating_lane": "${{ steps.refs.outputs.live_operating_lane }}",
            "source_commit": "${{ steps.refs.outputs.production_sha }}",
            "staging_source_commit": "${{ steps.refs.outputs.staging_sha }}"
          }
          EOF
          cat > pages-root/staging/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          cat > pages-root/staging/environment.json <<EOF
          {
            "environment": "staging",
            "deployment_surface": "staging_sandbox",
            "operating_lane": null,
            "supabase_project_ref": "gfalgonektwdylsxsgzc",
            "source_commit": "${{ steps.refs.outputs.staging_sha }}",
            "production_source_commit": "${{ steps.refs.outputs.production_sha }}"
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-root

  deploy:
    name: Deploy production and staging to GitHub Pages
    needs: [package-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  report:
    name: Record production and staging deployment status
    if: ${{ always() }}
    needs: [package-pages, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout status branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: automation/pages-status
          fetch-depth: 0

      - name: Write deployment result
        shell: bash
        run: |
          if [[ "${{ needs.package-pages.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            trigger_branch="${{ github.event.workflow_run.head_branch }}"
            trigger_commit="${{ github.event.workflow_run.head_sha }}"
            validation="${{ github.event.workflow_run.conclusion }}"
            validation_run_url="${{ github.event.workflow_run.html_url }}"
          else
            trigger_branch="manual"
            trigger_commit="${GITHUB_SHA}"
            validation="manual"
            validation_run_url=""
          fi

          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > pages-status.json <<EOF
          {
            "status": "$status",
            "validation": "$validation",
            "package_pages": "${{ needs.package-pages.result }}",
            "deploy": "${{ needs.deploy.result }}",
            "production_url": "https://ednotebook.com/",
            "production_deployment_surface": "live_service",
            "live_operating_lane": "${{ needs.package-pages.outputs.live_operating_lane }}",
            "staging_url": "https://ednotebook.com/staging/",
            "staging_deployment_surface": "staging_sandbox",
            "page_url": "${{ needs.deploy.outputs.page_url }}",
            "production_source_commit": "${{ needs.package-pages.outputs.production_sha }}",
            "staging_source_commit": "${{ needs.package-pages.outputs.staging_sha }}",
            "trigger_branch": "$trigger_branch",
            "trigger_commit": "$trigger_commit",
            "validation_run_url": "$validation_run_url",
            "deployment_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "deployed_at": "$deployed_at"
          }
          EOF

      - name: Commit deployment result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.json
          git diff --cached --quiet || git commit -m "Record Pages deployment ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:automation/pages-status
