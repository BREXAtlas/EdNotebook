name: Apply Builder course sync codemod

on:
  push:
    branches: [agent/builder-sync-performance-split]
    paths:
      - scripts/apply-builder-course-sync.mjs
      - .github/workflows/apply-builder-sync-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/builder-sync-performance-split
          fetch-depth: 0

      - name: Apply Builder synchronization
        run: node scripts/apply-builder-course-sync.mjs

      - name: Commit generated Builder change
        run: |
          if git diff --quiet -- src/Builder.jsx; then
            echo "Builder already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Builder.jsx
          git commit -m "Wire generated Builder lessons into course packages [skip ci]"
          git push origin HEAD:agent/builder-sync-performance-split
