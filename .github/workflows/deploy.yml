name: Build and deploy EdNotebook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test student-data safety controls
        run: npm run test:student-data-safety

      - name: Test Blackboard reconciliation contracts
        run: npm run test:blackboard

      - name: Test LTI data contracts
        run: npm run test:lti

      - name: Build production site
        run: npm run build

      - name: Verify core and feature bundle split
        run: npm run audit:bundle

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  security-tests:
    name: Test security services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/document-security-worker/requirements.txt

      - name: Install worker test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1
          python -m pip install --upgrade pip
          python -m pip install -r services/document-security-worker/requirements.txt pytest==8.4.1

      - name: Test archive inspection and EduBook conversion
        env:
          PYTHONPATH: services/document-security-worker
        run: pytest -q services/document-security-worker/tests

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts supabase/functions/*/index.ts

      - name: Test LTI claim and cryptography controls
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/lti/*.test.ts

      - name: Test deletion failure handling
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/deletion.test.ts

  database-safety:
    name: Rehearse student-data database gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Start a fresh local Supabase database and apply every migration
        run: supabase db start

      - name: Run rollback-safe student-data safety gates
        env:
          PGCONNECT_TIMEOUT: '10'
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/institution_student_data_safety.sql

      - name: Stop the disposable local database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, security-tests, database-safety]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Record production deployment status
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, security-tests, database-safety, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v6
        with:
          ref: automation/pages-status
          fetch-depth: 0

      - name: Write deployment result
        shell: bash
        run: |
          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.security-tests.result }}" == "success" && "${{ needs.database-safety.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi

          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > pages-status.json <<EOF
          {
            "status": "$status",
            "build": "${{ needs.build.result }}",
            "security_tests": "${{ needs.security-tests.result }}",
            "database_safety": "${{ needs.database-safety.result }}",
            "deploy": "${{ needs.deploy.result }}",
            "page_url": "${{ needs.deploy.outputs.page_url }}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "source_commit": "${GITHUB_SHA}",
            "deployed_at": "$deployed_at"
          }
          EOF

      - name: Commit deployment result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.json
          git commit -m "Record Pages deployment ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:automation/pages-status
