name: Build and deploy EdNotebook production and staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ednotebook-pages-combined
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test student-data safety controls
        run: npm run test:student-data-safety

      - name: Test Blackboard reconciliation contracts
        run: npm run test:blackboard

      - name: Test LTI data contracts
        run: npm run test:lti

      - name: Test governed professor outline contract
        run: npm run test:ai-outline

      - name: Build production configuration
        run: npm run build

      - name: Verify production bundle split
        run: npm run audit:bundle

      - name: Build staging configuration
        run: npm run build:staging

      - name: Verify staging bundle split
        run: npm run audit:bundle

  security-tests:
    name: Test security services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/document-security-worker/requirements.txt

      - name: Install worker test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1
          python -m pip install --upgrade pip
          python -m pip install -r services/document-security-worker/requirements.txt pytest==8.4.1

      - name: Test archive inspection and EduBook conversion
        env:
          PYTHONPATH: services/document-security-worker
        run: pytest -q services/document-security-worker/tests

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts supabase/functions/*/index.ts

      - name: Test LTI claim and cryptography controls
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/lti/*.test.ts

      - name: Test deletion failure handling
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/deletion.test.ts

  database-safety:
    name: Rehearse student-data database gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Start a fresh local Supabase database and apply every migration
        run: supabase db start

      - name: Run rollback-safe student-data safety gates
        env:
          PGCONNECT_TIMEOUT: '10'
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/institution_student_data_safety.sql

      - name: Stop the disposable local database
        if: always()
        run: supabase stop --no-backup

  package-pages:
    name: Build production root and staging subsite
    if: github.event_name != 'pull_request'
    needs: [validate, security-tests, database-safety]
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.refs.outputs.production_sha }}
      staging_sha: ${{ steps.refs.outputs.staging_sha }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: production-source
          fetch-depth: 1

      - name: Checkout staging source
        uses: actions/checkout@v6
        with:
          ref: staging
          path: staging-source
          fetch-depth: 1

      - name: Use production source until staging receives the deployment foundation
        shell: bash
        run: |
          if [[ ! -f staging-source/.env.staging ]]; then
            rm -rf staging-source
            cp -a production-source staging-source
          fi

      - name: Record source commits
        id: refs
        shell: bash
        run: |
          echo "production_sha=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$(git -C staging-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            staging-source/package-lock.json

      - name: Build production from main
        working-directory: production-source
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run audit:bundle

      - name: Build staging from staging
        working-directory: staging-source
        run: |
          npm ci --no-audit --no-fund
          npm run build:staging
          npm run audit:bundle

      - name: Assemble one GitHub Pages artifact
        shell: bash
        run: |
          mkdir -p pages-root/staging
          cp -a production-source/dist/. pages-root/
          cp -a staging-source/dist/. pages-root/staging/
          rm -f pages-root/staging/CNAME
          cat > pages-root/staging/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          cat > pages-root/staging/environment.json <<EOF
          {
            "environment": "staging",
            "supabase_project_ref": "gfalgonektwdylsxsgzc",
            "source_commit": "${{ steps.refs.outputs.staging_sha }}",
            "production_source_commit": "${{ steps.refs.outputs.production_sha }}"
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-root

  deploy:
    name: Deploy production and staging to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [package-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      # The default github-pages environment is restricted to main. Staging
      # uses its own environment while deploying the same combined artifact.
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-staging' }}
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Record production and staging deployment status
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [validate, security-tests, database-safety, package-pages, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v6
        with:
          ref: automation/pages-status
          fetch-depth: 0

      - name: Write deployment result
        shell: bash
        run: |
          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.security-tests.result }}" == "success" && "${{ needs.database_safety.result }}" == "success" && "${{ needs.package_pages.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi

          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > pages-status.json <<EOF
          {
            "status": "$status",
            "validation": "${{ needs.validate.result }}",
            "security_tests": "${{ needs.security-tests.result }}",
            "database_safety": "${{ needs.database-safety.result }}",
            "package_pages": "${{ needs.package-pages.result }}",
            "deploy": "${{ needs.deploy.result }}",
            "production_url": "https://ednotebook.com/",
            "staging_url": "https://ednotebook.com/staging/",
            "page_url": "${{ needs.deploy.outputs.page_url }}",
            "production_source_commit": "${{ needs.package-pages.outputs.production_sha }}",
            "staging_source_commit": "${{ needs.package-pages.outputs.staging_sha }}",
            "trigger_commit": "${GITHUB_SHA}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "deployed_at": "$deployed_at"
          }
          EOF

      - name: Commit deployment result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.json
          git diff --cached --quiet || git commit -m "Record Pages deployment ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:automation/pages-status
