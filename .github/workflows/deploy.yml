name: Validate EdNotebook production and staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ednotebook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test student-data safety controls
        run: npm run test:student-data-safety

      - name: Test Blackboard reconciliation contracts
        run: npm run test:blackboard

      - name: Test LTI data contracts
        run: npm run test:lti

      - name: Test governed professor outline contract
        run: npm run test:ai-outline

      - name: Test ASU syllabus requirement extraction
        run: npm run test:syllabus-extraction

      - name: Test governed student semester calendar workflow
        run: npm run test:student-semester

      - name: Test governed selected-lesson review workflow
        run: npm run test:lesson-generation

      - name: Test in-platform student course acceptance
        run: npm run test:student-experience

      - name: Test fail-closed Digital Literacy research governance
        run: npm run test:research-gate

      - name: Test Digital Literacy student learning workspace
        run: npm run test:student-learning

      - name: Test Social Education Learning rewards
        run: npm run test:social-learning

      - name: Test professor-student course communication sync
        run: npm run test:course-communication

      - name: Test governed commercial publishing experience
        run: npm run test:commercial-publishing

      - name: Test governed EduBook publishing experience
        run: npm run test:edubook-publishing

      - name: Test governed in-platform media and resources
        run: npm run test:media-resources

      - name: Test media accessibility, versioning, and evidence
        run: npm run test:media-accessibility

      - name: Test governed media-to-learning integration
        run: npm run test:media-learning

      - name: Test production and staging browser storage isolation
        run: npm run test:environment-storage

      - name: Build production configuration
        run: npm run build

      - name: Verify production bundle split
        run: npm run audit:bundle

      - name: Build staging configuration
        run: npm run build:staging

      - name: Verify staging bundle split
        run: npm run audit:bundle

  security-tests:
    name: Test security services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/document-security-worker/requirements.txt

      - name: Install worker test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1
          python -m pip install --upgrade pip
          python -m pip install -r services/document-security-worker/requirements.txt pytest==8.4.1

      - name: Test archive inspection and EduBook conversion
        env:
          PYTHONPATH: services/document-security-worker
        run: pytest -q services/document-security-worker/tests

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts supabase/functions/*/index.ts

      - name: Test LTI claim and cryptography controls
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/lti/*.test.ts

      - name: Test deletion failure handling
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/deletion.test.ts

  database-safety:
    name: Rehearse student-data database gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Start a fresh local Supabase database and apply every migration
        run: supabase db start

      - name: Run rollback-safe student-data safety gates
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/institution_student_data_safety.sql

      - name: Run fail-closed Digital Literacy research gates
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/digital_literacy_research_gate.sql

      - name: Run Campus Social first-profile return gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/campus_social_returning_gate.sql

      - name: Run governed course enrollment access gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/course_enrollment_access_gate.sql

      - name: Run Alex B. Morrison Library publishing gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/alex_morrison_library_gate.sql

      - name: Run governed commercial publishing gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/commercial_publishing_gate.sql

      - name: Run governed EduBook learning gate
        env:
          PGCONNECTTIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/edubook_learning_gate.sql

      - name: Run governed in-platform media and resources gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/in_platform_media_resources_gate.sql

      - name: Run media accessibility, versioning, and evidence gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/media_accessibility_evidence_gate.sql

      - name: Run governed media-to-learning workflow gate
        env:
          PGCONNECT_TIMEOUT: "10"
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set=ON_ERROR_STOP=1
          --echo-errors
          --file=supabase/tests/media_learning_workflow_gate.sql

      - name: Stop the disposable local database
        if: always()
        run: supabase stop --no-backup
