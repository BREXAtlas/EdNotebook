name: Build and deploy EdNotebook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_LIVE_ROOMS_ENABLED: ${{ vars.VITE_LIVE_ROOMS_ENABLED }}
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  security-tests:
    name: Test security services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/document-security-worker/requirements.txt

      - name: Install worker test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1
          python -m pip install --upgrade pip
          python -m pip install -r services/document-security-worker/requirements.txt pytest==8.4.1

      - name: Test archive inspection and EduBook conversion
        env:
          PYTHONPATH: services/document-security-worker
        run: pytest -q services/document-security-worker/tests

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts supabase/functions/*/index.ts

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, security-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Record production deployment status
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, security-tests, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v6
        with:
          ref: automation/pages-status
          fetch-depth: 0

      - name: Write deployment result
        shell: bash
        run: |
          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.security-tests.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi

          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > pages-status.json <<EOF
          {
            "status": "$status",
            "build": "${{ needs.build.result }}",
            "security_tests": "${{ needs.security-tests.result }}",
            "deploy": "${{ needs.deploy.result }}",
            "page_url": "${{ needs.deploy.outputs.page_url }}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "source_commit": "${GITHUB_SHA}",
            "deployed_at": "$deployed_at"
          }
          EOF

      - name: Commit deployment result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.json
          git commit -m "Record Pages deployment ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:automation/pages-status
