name: Apply merged-state unresolved summary fix

on:
  push:
    branches: [fix/syllabus-unresolved-summary]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[unresolved-summary-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/syllabus-unresolved-summary
          fetch-depth: 0

      - name: Reconcile unresolved items against merged syllabus state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai/SyllabusToCourse.jsx')
          text = path.read_text()
          old = '''      setResult({ ...merged, uncertainSections: [] });
      setAiReview({
        fields: appliedFields,
        missingInformation: response.artifact?.missingInformation || [],
        conflictingInformation: response.artifact?.conflictingInformation || [],
      });
'''
          new = '''      const unresolvedRequired = (merged.requirementReview?.missingRequired || [])
        .map((item) => `${item.sectionTitle}: ${item.label}`);
      setResult({ ...merged, uncertainSections: [] });
      setAiReview({
        fields: appliedFields,
        missingInformation: unresolvedRequired,
        conflictingInformation: merged.conflictingInformation || [],
      });
'''
          if old not in text:
              raise SystemExit('expected aiReview block not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('src/ai/syllabusAiReturnedDraft.static.test.js')
          test_text = test_path.read_text()
          marker = 'assert.match(source, /unresolvedRequired/);'
          if marker not in test_text:
              test_text = test_text.replace(
                  '  assert.match(source, /uncertainSections: \\[\\]/);\n',
                  '  assert.match(source, /uncertainSections: \\[\\]/);\n  assert.match(source, /unresolvedRequired/);\n  assert.doesNotMatch(source, /missingInformation: response\\.artifact/);\n',
                  1,
              )
          test_path.write_text(test_text)
          PY

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/SyllabusToCourse.jsx src/ai/syllabusAiReturnedDraft.static.test.js
          git commit -m "Reconcile AI unresolved summary with merged syllabus state [unresolved-summary-applied]"
          git push origin HEAD:fix/syllabus-unresolved-summary
