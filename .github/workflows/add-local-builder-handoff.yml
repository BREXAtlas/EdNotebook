name: Add local Course Forge handoff

on:
  push:
    branches: [agent/builder-sync-performance-split]
    paths:
      - scripts/add-local-builder-handoff.mjs
      - .github/workflows/add-local-builder-handoff.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/builder-sync-performance-split
          fetch-depth: 0

      - name: Apply local handoff
        run: node scripts/add-local-builder-handoff.mjs

      - name: Commit Course Output handoff
        run: |
          if git diff --quiet -- src/course-runtime/CoursePackageStudio.jsx; then
            echo "Local handoff already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/course-runtime/CoursePackageStudio.jsx
          git commit -m "Load latest local Course Forge draft in Course Output [skip ci]"
          git push origin HEAD:agent/builder-sync-performance-split
