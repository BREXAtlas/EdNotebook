name: Fix Builder sync prop

on:
  push:
    branches: [agent/builder-sync-performance-split]
    paths:
      - scripts/fix-builder-sync-prop.mjs
      - .github/workflows/fix-builder-sync-prop.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/builder-sync-performance-split
          fetch-depth: 0

      - name: Apply correction
        run: node scripts/fix-builder-sync-prop.mjs

      - name: Commit corrected Builder
        run: |
          if git diff --quiet -- src/Builder.jsx; then
            echo "Builder already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Builder.jsx
          git commit -m "Pass Course Forge sync status into lesson workspace [skip ci]"
          git push origin HEAD:agent/builder-sync-performance-split
