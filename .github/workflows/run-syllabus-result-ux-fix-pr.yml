name: Run syllabus result UX fix for PR

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phase-3-extraction-feedback
          fetch-depth: 0

      - name: Apply focused Phase 3 UX changes
        run: python scripts/apply-syllabus-ux-fix.py

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/SyllabusToCourse.jsx src/ai/syllabus-to-course-fixes.css src/ai/syllabusExtractionUx.static.test.js package.json
          git diff --cached --quiet || git commit -m "Improve syllabus extraction feedback and navigation [syllabus-ux-applied]"
          git push origin HEAD:fix/phase-3-extraction-feedback
