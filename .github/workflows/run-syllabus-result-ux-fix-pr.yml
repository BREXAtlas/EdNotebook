name: Run syllabus result UX fix for PR

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phase-3-extraction-feedback
          fetch-depth: 0

      - name: Run the checked-in focused fixer
        id: fixer
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY' > fixer-report.txt 2>&1
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/apply-syllabus-result-ux-fix.yml').read_text()
              start_marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n"
              if start_marker not in workflow or end_marker not in workflow:
                  raise RuntimeError('Could not find embedded fixer')
              code = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
              code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
              exec(compile(code, 'syllabus-ux-fix.py', 'exec'))
              print('FIXER_COMPLETED')
          except Exception:
              traceback.print_exc()
              raise
          PY

      - name: Upload fixer report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: syllabus-ux-fixer-report
          path: fixer-report.txt

      - name: Fail when fixer failed
        if: steps.fixer.outcome == 'failure'
        run: exit 1

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/SyllabusToCourse.jsx src/ai/syllabus-to-course-fixes.css src/ai/syllabusExtractionUx.static.test.js package.json
          git diff --cached --quiet || git commit -m "Improve syllabus extraction feedback and navigation [syllabus-ux-applied]"
          git push origin HEAD:fix/phase-3-extraction-feedback
