name: Run visible AI syllabus draft patch

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/syllabus-ai-visible-draft
          fetch-depth: 0

      - name: Run checked-in focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-syllabus-ai-visible-draft.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow or end not in workflow:
              raise SystemExit('embedded patch not found')
          code = workflow.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          exec(compile(code, 'apply-syllabus-ai-visible-draft.py', 'exec'))
          PY

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/SyllabusToCourse.jsx src/ai/syllabus-to-course-fixes.css src/ai/syllabusAiReturnedDraft.static.test.js package.json
          git diff --cached --quiet || git commit -m "Show and validate returned AI syllabus draft [ai-draft-visible-applied]"
          git push origin HEAD:fix/syllabus-ai-visible-draft
