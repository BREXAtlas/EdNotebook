name: Run Phase 3 inline status fix

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phase-3-inline-status-and-ai-lock
          fetch-depth: 0

      - name: Apply Phase 3 fix
        run: python scripts/apply-phase3-inline-status.py

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/SyllabusToCourse.jsx src/ai/syllabus-to-course-fixes.css src/ai/syllabusExtractionUx.static.test.js
          git diff --cached --quiet || git commit -m "Keep Phase 3 feedback inline and deduplicate AI requests [phase3-inline-applied]"
          git push origin HEAD:fix/phase-3-inline-status-and-ai-lock
